<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全国城市地铁观察体系（浅色版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef2f8;--bg2:#e4eaf4;--card:rgba(255,255,255,.82);--line:rgba(40,80,160,.20);
--txt:#15233f;--dim:#5a6a8c;--neon:#0a7fb5;--neon2:#5b3fd0;--grn:#0f9d6b;--amb:#b07a16;--red:#d23a55}
body{background:radial-gradient(1100px 620px at 12% -8%,#cfe0f6 0%,transparent 60%),
radial-gradient(900px 520px at 92% 4%,#e6dcf6 0%,transparent 58%),var(--bg);
color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
min-height:100vh;padding:28px 18px 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:25px;font-weight:700;letter-spacing:.4px;
background:linear-gradient(92deg,#1f8fb8,#5b3fd0 55%,#0f9d6b);
-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:8px;line-height:1.8}
.glass{background:var(--card);border:1px solid var(--line);border-radius:16px;
backdrop-filter:blur(13px);box-shadow:0 10px 34px rgba(20,40,80,.16);padding:22px 22px}
.sec{margin:22px 0 12px;font-size:16px;font-weight:650;display:flex;align-items:center;gap:9px}
.sec:before{content:"";width:3px;height:17px;border-radius:2px;background:linear-gradient(180deg,var(--neon),var(--neon2))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-top:14px}
a.card{display:block;text-decoration:none;color:var(--txt);background:var(--card);
border:1px solid var(--line);border-radius:14px;padding:16px 17px;transition:.18s;
box-shadow:0 6px 20px rgba(20,40,80,.10)}
a.card:hover{transform:translateY(-3px);border-color:var(--neon);
box-shadow:0 12px 30px rgba(10,127,181,.22)}
a.card .t{font-size:15.5px;font-weight:650}
a.card .d{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6}
.foot{color:var(--dim);font-size:11.5px;margin-top:26px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>全国城市地铁观察体系</h1>
  <div class="sub">浅色版 · 伯克希尔数据中心已下线归档，本站点仅保留地铁观察内容</div>

  <div class="sec">数据页面</div>
  <div class="cards">
    <a class="card" href="metro_all.html">
      <div class="t">四页合一总览</div>
      <div class="d">线路、通勤、对比、票价的核心指标汇总</div>
    </a>
    <a class="card" href="metro_map.html">
      <div class="t">地铁线路地图</div>
      <div class="d">各城市轨交线网空间分布</div>
    </a>
    <a class="card" href="metro_commute.html">
      <div class="t">通勤分析</div>
      <div class="d">通勤时长、覆盖与职住特征</div>
    </a>
    <a class="card" href="metro_compare.html">
      <div class="t">城市对比</div>
      <div class="d">多城市地铁规模与效率横向比较</div>
    </a>
    <a class="card" href="metro_fare.html">
      <div class="t">票价体系</div>
      <div class="d">计费规则、性价比与补贴结构</div>
    </a>
  </div>

  <div class="foot">本页为静态快照，数据边界以各页面内说明为准 · 不构成任何投资建议</div>
</div>
</body>
</html>
