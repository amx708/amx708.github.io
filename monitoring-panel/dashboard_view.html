  .header .sub{color:var(--dim);font-size:13px;}
  .tag{display:inline-block;background:rgba(91,140,255,0.15);color:var(--accent);
    border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:12px;margin-left:8px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;margin-top:14px;margin-bottom:6px;}
  .group-head{font-size:14px;font-weight:700;color:var(--text);margin:24px 0 0;
    padding:9px 14px;border-left:4px solid var(--accent);background:rgba(91,140,255,.07);
    border-radius:0 8px 8px 0;letter-spacing:.5px;}
  .group-head.cheap{border-left-color:var(--green);background:rgba(54,211,153,.07);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:18px 18px 16px;backdrop-filter:blur(10px);position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--cyan));opacity:.7;}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .card-icon{font-size:20px;}
  .card-title{font-size:15px;font-weight:600;flex:1;}
  .badge{font-size:11px;padding:3px 9px;border-radius:8px;font-weight:600;white-space:nowrap;}
  .badge.green{background:rgba(54,211,153,.16);color:var(--green);}
  .badge.yellow{background:rgba(251,191,36,.16);color:var(--yellow);}
  .badge.orange{background:rgba(251,146,60,.16);color:var(--orange);}
  .badge.red{background:rgba(248,113,113,.18);color:var(--red);}
  .badge.gray{background:rgba(107,114,128,.2);color:var(--gray);}
  .card-value{font-size:34px;font-weight:800;line-height:1;margin:6px 0 2px;}
  .card-value .unit{font-size:15px;font-weight:600;color:var(--dim);margin-left:4px;}
  .card-desc{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6;}
  .human-box{margin-top:12px;background:rgba(63,224,208,.08);border-left:3px solid var(--cyan);
    border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.7;color:#cfeef0;}
  .human-box b{color:var(--cyan);}
  .holdings,.etflist{margin-top:10px;font-size:12px;}
  .hitem{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(120,160,255,.1);}
  .hitem span:last-child{color:var(--dim);}
  table.mini{width:100%;border-collapse:collapse;margin-top:10px;font-size:11.5px;}
  table.mini th,table.mini td{border:1px solid var(--border);padding:4px 6px;text-align:center;color:var(--dim);}
  table.mini th{color:var(--text);background:rgba(91,140,255,.08);}
  .dead{margin-top:10px;font-size:12px;color:var(--red);line-height:1.6;}
  .manual-note{margin-top:8px;font-size:11px;color:var(--yellow);}
  .footer{margin-top:26px;color:var(--dim);font-size:11px;text-align:center;line-height:1.8;}
</style>
</head>

    if(items.length){
      h += '<table class="mini"><tr><th>代码</th><th>名称</th><th>股息率</th><th>现价</th><th>涨%</th><th>分红次数</th></tr>' +
        items.map(t => `<tr><td>${t.code}</td><td style="color:var(--text)">${t.name}</td><td style="color:var(--green)">${t.dy}%</td><td>${t.price}</td><td style="color:${t.chg>=0?'var(--green)':'var(--red)'}">${t.chg}</td><td>${t.times}</td></tr>`).join('') +
        '</table>';
      if(items.length >= 20) h += '<div class="manual-note">↑ 仅显示股息率最高的前 20 只</div>';
    }
  }
  if(c.manual){
    h += '<div class="manual-note">📌 该指标含公告类数据，需手动补充（见 luckzpz 原帖）</div>';
  }
  return h;
}

function cardHTML(c){
  return `<div class="card">
    <div class="card-head">
      <span class="card-icon">${c.icon||'📌'}</span>
      <span class="card-title">${c.title}</span>
      <span class="badge ${statusClass(c)}">${c.status}</span>
    </div>
    <div class="card-value">${c.value}<span class="unit">${c.unit||''}</span></div>
    <div class="card-desc">${c.desc||''}</div>
    ${extras(c)}
    <div class="human-box">💬 ${c.human}</div>
  </div>`;
}

function render(){
  document.getElementById('updtime').textContent = '更新于 ' + (DATA.update_time || '');
  const GROUP_TITLE = {
    "warn": "🔴 贵了别追 · luckzpz 温度计",
    "cheap": "🟢 便宜了该买 · 价值锚",
  };
  const groups = ["warn","cheap"];
  let html = '';
  for(const g of groups){
    const cs = DATA.cards.filter(c => (c.group||'warn') === g);
    if(!cs.length) continue;
    html += `<div class="group-head ${g}">${GROUP_TITLE[g]} · 共 ${cs.length} 项</div>`;
    html += '<div class="grid">' + cs.map(cardHTML).join('') + '</div>';
  }
  document.getElementById('cards').innerHTML = html;
}
render();
</script>
