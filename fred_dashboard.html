<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRED 宏观监测看板</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Helvetica,sans-serif;background:#f6f7f9;color:#1a1a1a;padding:20px 24px 36px;line-height:1.5}
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  h1{font-size:22px;font-weight:700}
  .sub{color:#64748b;font-size:12px;margin-top:2px}
  .actions{display:flex;gap:8px;align-items:center}
  button{background:#2563eb;color:#fff;border:0;padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer}
  button:hover{background:#1d4ed8}
  button:disabled{background:#94a3b8;cursor:not-allowed}
  .summary{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;margin-bottom:18px}
  .summary h2{font-size:14px;color:#0f172a;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .summary ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px}
  .summary li{font-size:13px;color:#334155;padding:4px 0}
  .summary li b{color:#0f172a;font-weight:600;margin-right:4px}
  .summary li .ts{color:#94a3b8;font-size:11px;margin-left:4px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-left:6px}
  .badge.up{background:#fee2e2;color:#b91c1c}
  .badge.down{background:#dcfce7;color:#166534}
  .badge.warn{background:#fef3c7;color:#92400e}
  .badge.ok{background:#dcfce7;color:#166534}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px 12px}
  .card h3{font-size:14px;color:#0f172a;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .card .meta{font-size:11px;color:#64748b;font-weight:400}
  .card .val{font-size:26px;font-weight:700;color:#0f172a;margin:6px 0 4px;letter-spacing:-.5px}
  .card .val small{font-size:12px;color:#64748b;font-weight:400;margin-left:4px}
  .card .date{font-size:11px;color:#94a3b8;margin-bottom:10px}
  .card canvas{height:130px!important;width:100%!important}
  .card .hint{font-size:11px;color:#64748b;margin-top:8px;padding-top:8px;border-top:1px dashed #e5e7eb}
  .risk{margin-top:24px;padding:12px 16px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:12px;color:#92400e;line-height:1.6}
  footer{margin-top:18px;font-size:11px;color:#94a3b8;text-align:center}
  .loading{color:#94a3b8;font-size:12px;padding:20px;text-align:center}
  .err{color:#b91c1c;font-size:12px;padding:8px}
  .back-home{position:fixed;top:12px;right:12px;z-index:9999;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;padding:7px 16px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;transition:transform .2s}
  .back-home:hover{transform:translateX(2px)}
</style>
</head>
<body>

<a class="back-home" href="./index.html">← 返回主页</a>

<header>
  <div>
    <h1>📊 FRED 宏观监测看板</h1>
    <p class="sub">数据源：圣路易斯联储 FRED · 免费 API · 本地快照（零后端，不再依赖后台服务）</p>
  </div>
  <div class="actions">
    <span class="sub" id="update-time">--</span>
    <button id="refresh">🔄 刷新</button>
  </div>
</header>

<div id="protocol-warn" style="display:none;margin-bottom:14px;padding:14px 18px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;color:#92400e;font-size:13px;line-height:1.7"></div>

<div class="summary">
  <h2>📌 结论速览（最新值）</h2>
  <ul id="summary"><li class="loading">加载中…</li></ul>
</div>

<div class="grid" id="cards"><div class="loading">读取本地快照中…</div></div>

<div class="risk">
⚠️ <b>风险提示</b>：本看板数据来自美国官方宏观指标，用于辅助判断全球宏观周期与汇率联动，不构成投资建议。A股/港股/大宗商品投资请结合国内政策、地缘与公司基本面综合判断。过往宏观规律不必然预示未来。
</div>

<footer>
FRED 公开数据 · 速率限制 120 次/分钟 · 每日 6,000 次 · 数据可能修订
</footer>

<script src="chart.umd.min.js"></script>
<script>
// ========== 配置 ==========
// 零后端：数据来自本地快照 ./fred_data.json（由 fred_refresh.py 用你的 FRED key 生成）。
// 不再依赖任何本机服务（原 8765 代理已移除），从根上不弹窗、不跨域。
// 想更新数据：在主机上把 key 填入 fred_key.txt，运行 fred_refresh.py 即可重新生成快照。

const INDICATORS = [
  {id:'FEDFUNDS',  name:'美联储利率',     unit:'',  freq:'月度', note:'联邦基金有效利率',  fmt:v=>v.toFixed(2)+' %'},
  {id:'DEXCHUS',   name:'美元 / 人民币',  unit:'',  freq:'日度', note:'USDCNY 中间价',     fmt:v=>v.toFixed(4)+' 元', invert:true /* 人民币升值=对A股有利 */},
  {id:'DCOILWTICO',name:'WTI 原油',       unit:'',  freq:'日度', note:'德州轻质原油现货',  fmt:v=>'$'+v.toFixed(2)},
  {id:'DGS10',     name:'美债10年收益率', unit:'',  freq:'日度', note:'10年期国债',        fmt:v=>v.toFixed(2)+' %'},
  {id:'CPIAUCSL',  name:'美国CPI同比',    unit:'',  freq:'月度', note:'YoY% (快照已算好)', fmt:v=>v.toFixed(2)+' %'},
  {id:'T10Y2Y',    name:'10Y-2Y 利差',    unit:'',  freq:'日度', note:'衰退信号：负值=倒挂',fmt:v=>(v>=0?'+':'')+v.toFixed(2)+' pp'},
  {id:'USREC',     name:'NBER 衰退标记',  unit:'',  freq:'月度', note:'1=衰退期 0=扩张期', fmt:v=>v===1?'衰退中':'扩张期', isBinary:true},
];

let FRED_DATA = null;

async function loadData(){
  const r = await fetch('./fred_data.json', {cache:'no-store'});
  if(!r.ok) throw new Error('fred_data.json 读取失败 (HTTP '+r.status+')');
  const d = await r.json();
  FRED_DATA = d;
  return d;
}

function seriesOf(sid){
  const arr = (FRED_DATA && FRED_DATA.series && FRED_DATA.series[sid]) || [];
  return arr
    .map(o=>({date:o.date, value:parseFloat(o.value)}))
    .filter(o=>!isNaN(o.value) && o.value!==null);
}

// ========== 渲染单卡 ==========
const charts = {};
function buildCard(ind, arr){
  const latest = arr[arr.length-1];
  const prev   = arr.length>=2 ? arr[arr.length-2] : null;
  const firstY = arr[0]?.date || '';
  const lastY  = latest.date;

  const card = document.createElement('div');
  card.className='card';

  let extraBadge = '';
  if (ind.id==='T10Y2Y'){
    extraBadge = latest.value < 0
      ? '<span class="badge warn">⚠ 倒挂</span>'
      : '<span class="badge ok">正常</span>';
  }
  if (ind.id==='USREC'){
    extraBadge = latest.value===1
      ? '<span class="badge warn">衰退中</span>'
      : '<span class="badge ok">扩张</span>';
  }

  card.innerHTML = `
    <h3>${ind.name}${extraBadge} <span class="meta">${ind.freq}</span></h3>
    <div class="val">${ind.fmt(latest.value)}</div>
    <div class="date">最新：${latest.date}${prev?` · 上期 ${prev.value.toFixed(2)}`:''}</div>
    <canvas id="c-${ind.id}"></canvas>
    <div class="hint">${ind.note} · 区间 ${firstY} → ${lastY}（${arr.length} 个观测点）</div>
  `;
  document.getElementById('cards').appendChild(card);

  const color = ind.id==='DEXCHUS' && ind.invert ? '#16a34a' : '#2563eb';
  const bg    = ind.id==='DEXCHUS' && ind.invert ? 'rgba(22,163,74,.08)' : 'rgba(37,99,235,.08)';

  const ctx = document.getElementById('c-'+ind.id).getContext('2d');
  charts[ind.id] = new Chart(ctx, {
    type:'line',
    data:{
      labels:arr.map(o=>o.date),
      datasets:[{
        data:arr.map(o=>o.value),
        borderColor:color,
        backgroundColor:bg,
        fill:true,
        tension:.25,
        pointRadius:0,
        borderWidth:1.5
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.parsed.y}`}}},
      scales:{
        x:{display:false},
        y:{ticks:{font:{size:10}, maxTicksLimit:5}, grid:{color:'#f1f5f9'}}
      }
    }
  });

  return latest;
}

function buildSummary(ind, latest){
  const li = document.createElement('li');
  let badge = '';
  if (ind.id==='T10Y2Y') badge = latest.value<0?'<span class="badge warn">倒挂</span>':'<span class="badge ok">正常</span>';
  if (ind.id==='USREC')  badge = latest.value===1?'<span class="badge warn">衰退中</span>':'<span class="badge ok">扩张</span>';
  li.innerHTML = `<b>${ind.name}：</b>${ind.fmt(latest.value)}${badge}<span class="ts">(${latest.date})</span>`;
  document.getElementById('summary').appendChild(li);
}

// ========== 主流程 ==========
async function refresh(){
  document.getElementById('cards').innerHTML = '<div class="loading">读取本地快照中…</div>';
  document.getElementById('summary').innerHTML = '<li class="loading">加载中…</li>';
  Object.values(charts).forEach(c=>c.destroy());
  for(const k of Object.keys(charts)) delete charts[k];

  try {
    await loadData();
  } catch(e){
    const c = document.getElementById('cards');
    c.innerHTML = `<div class="err" style="padding:16px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;line-height:1.7">
      <b>📭 尚未生成 FRED 数据快照</b><br>
      本看板现已改为零后端，直接读取本地 <code>fred_data.json</code>，不再依赖后台服务，从根上不会弹窗。<br>
      <b>生成一次即可（在主机上操作）：</b><br>
      ① 把你的 FRED API Key 粘贴进同目录的 <code>fred_key.txt</code>（免费申请：<a href="https://fredaccount.stlouisfed.org/apikeys" target="_blank">fredaccount.stlouisfed.org/apikeys</a>）；<br>
      ② 双击运行 <code>fred_refresh.py</code>，它会写出 <code>deploy_site/fred_data.json</code>；<br>
      ③ 回到本页点「🔄 刷新」即可看到数据。<br>
      <span style="color:#94a3b8">（沙箱环境无密钥无法代生成；密钥仅存于你本机 fred_key.txt，不会上传。）</span>
    </div>`;
    document.getElementById('summary').innerHTML = '<li class="loading">无数据</li>';
    document.getElementById('update-time').textContent = '快照未生成';
    return;
  }

  document.getElementById('update-time').textContent = '快照时间：' + (FRED_DATA.generated_at||'未知');
  let errs = [];
  for (const ind of INDICATORS){
    try{
      const arr = seriesOf(ind.id);
      if (!arr.length){ errs.push(ind.name+': 空数据'); continue; }
      const latest = buildCard(ind, arr);
      buildSummary(ind, latest);
    } catch(e){
      console.error(e);
      errs.push(`${ind.name}: ${e.message}`);
    }
  }
  if (errs.length){
    const c = document.getElementById('cards');
    c.innerHTML = `<div class="err">部分指标读取失败：${errs.join('；')}</div>` + c.innerHTML;
  }
}

document.getElementById('refresh').addEventListener('click', async (e)=>{
  e.target.disabled = true; e.target.textContent = '⏳ 读取中…';
  await refresh();
  e.target.disabled = false; e.target.textContent = '🔄 刷新';
});

// 检测 file:// 协议并提示（固定横幅，不会被 refresh() 清掉）
if (location.protocol === 'file:') {
  document.getElementById('protocol-warn').style.display = 'block';
  document.getElementById('protocol-warn').innerHTML = `
    <b>⚠️ 检测到 file:// 协议 — 浏览器会拦截本地 JSON 读取</b><br>
    请通过伯克希尔数据中心站点打开本页（<code>http://127.0.0.1:8088/fred_dashboard.html</code>），
    或在 deploy_site 目录下执行 <code>python -m http.server 8088</code> 后访问。
  `;
}

refresh();
</script>
</body>
</html>
