<script>
const EM_UT = '7eea3edcaed734bea9cbfc24409ed989';

function fmtDateInput(v){ // YYYY-MM-DD -> YYYYMMDD
  return v ? v.replace(/-/g,'') : '';
}
function emWebUrl(code){
  code = (code||'').trim();
  if(!/^\d{6}$/.test(code)) return '';
  const c = code[0];
  const market = (c==='6'||c==='9') ? 'sh' : (c==='0'||c==='3') ? 'sz' : 'bj';
  return 'https://quote.eastmoney.com/concept/'+market+code+'.html';
}
function fmtTime(t){ // int HHMMSS -> HH:MM:SS
  if(t==null) return '-';
  const s = ('000000'+t).slice(-6);
  return s.slice(0,2)+':'+s.slice(2,4)+':'+s.slice(4,6);
}
function fmtMoney(v){ // 元 -> 万/亿
  if(v==null) return '-';
  const n = Number(v);
  if(Math.abs(n)>=1e8) return (n/1e8).toFixed(2)+'亿';
  if(Math.abs(n)>=1e4) return (n/1e4).toFixed(1)+'万';
  return n.toFixed(0);
}
function pct(v){ return (v==null)?'-':(Number(v).toFixed(2)+'%'); }

async function fetchJSON(url, timeout=12000){
  const ctl = new AbortController();
  const tid = setTimeout(()=>ctl.abort(), timeout);
  try{
    const r = await fetch(url, {signal:ctl.signal, mode:'cors'});
    clearTimeout(tid);
    if(!r.ok) return {ok:false, status:r.status, err:'HTTP '+r.status};
    const d = await r.json();
    return {ok:true, data:d};
  }catch(e){
    clearTimeout(tid);
    return {ok:false, err:e.name==='AbortError'?'请求超时':(e.message||'网络错误')};
  }
}

function showErr(boxId, msg){
  const box = document.getElementById(boxId);
  box.innerHTML = '<div class="err">⚠️ 加载失败：'+msg+'<br>多为浏览器跨域(CORS)被接口拦截或网络超时。可点右上「🔄 刷新」重试，或换一个交易日再试。</div>';
}
function showOk(boxId, msg){
  const box = document.getElementById(boxId);
  const old = box.querySelector('.ok-note');
  if(!old){ const d=document.createElement('div'); d.className='ok-note'; d.textContent=msg; box.prepend(d); }
}

/* ---------- 涨停判定 & 涨停池 ---------- */
function isLimitUp(code, name, f3){
  const v = Number(f3); const nm = name||'';
  if(/^[NC]/.test(nm)) return false;                // 新股(N/C前缀)首日/次新无涨跌幅限制
  if(nm.indexOf('ST')>=0) return v >= 4.8;          // ST 5%
  if(/^(30|688|689)/.test(code)) return v >= 19.8;  // 创业板/科创板 20%
  if(/^(8|4|92|87)/.test(code)) return v >= 29.5;   // 北交所 30%
  return v >= 9.9;                                  // 主板 10%
}
function boardType(code){
  if(/^(30|688|689)/.test(code)) return '创业/科创(20%)';
  if(/^(8|4|92|87)/.test(code)) return '北交所(30%)';
  return '主板(10%)';
}
async function fetchLimitUpSet(){
  const fs = 'm:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23';
  const pool = [];
  for(let pn=1; pn<=5; pn++){
    const url = `https://push2delay.eastmoney.com/api/qt/clist/get?pn=${pn}&pz=100&po=1&np=1&fltt=2&invt=2&fid=f3&fs=${fs}&fields=f12,f14,f2,f3,f62&_=${Date.now()}_${pn}`;
    const res = await fetchJSON(url);
    if(!res.ok) break;
    const list = (res.data && res.data.data && res.data.data.diff) || [];
    if(list.length===0) break;
    let minF3 = 999;
    list.forEach(x=>{ const v=Number(x.f3); if(v<minF3) minF3=v; if(isLimitUp(x.f12, x.f14, x.f3)) pool.push({ c:x.f12, n:x.f14, p:x.f2, zdp:x.f3, f62:x.f62 }); });
    if(minF3 < 9.5) break;   // 后续页不再可能出现涨停股，停止翻页
  }
  return pool;
}
async function loadZT(){
  const pool = await fetchLimitUpSet();
  if(pool===null){ showErr('zt-body','涨停池数据拉取失败（接口超时或被拦截）'); document.getElementById('zt-summary').innerHTML=''; return null; }
  const sum = document.getElementById('zt-summary');
  sum.innerHTML = `<div class="stat"><div class="v">${pool.length}</div><div class="k">涨停总数</div></div>`;
  if(pool.length===0){
    document.getElementById('zt-body').innerHTML='<div class="ok-note">今日无涨停（可能为非交易日或已收盘无数据）。</div>';
    return pool;
  }
  let rows = pool.map(x=>`<tr class="clickable" data-code="${x.c}">
      <td><code>${x.c}</code></td>
      <td>${x.n||''}</td>
      <td class="up">${x.p!=null?Number(x.p).toFixed(2):'-'}</td>
      <td class="up">${pct(x.zdp)}</td>
      <td class="${Number(x.f62)>=0?'up':'down'}">${fmtMoney(x.f62)}</td>
    </tr>`).join('');
  document.getElementById('zt-body').innerHTML = `
    <table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>主力净流入</th></tr></thead><tbody>${rows}</tbody></table>`;
  bindRows('zt-body');
  return pool;
}

/* ---------- 涨停梯队（按涨幅排序）---------- */
function renderLadder(pool){
  if(!pool || pool.length===0){ document.getElementById('ladder-body').innerHTML='<div class="ok-note">今日无涨停，暂无梯队。</div>'; return; }
  const sorted = pool.slice().sort((a,b)=>Number(b.zdp)-Number(a.zdp));
  let rows = sorted.map(x=>`<tr class="clickable" data-code="${x.c}">
      <td><code>${x.c}</code></td>
      <td>${x.n||''}</td>
      <td class="up">${x.p!=null?Number(x.p).toFixed(2):'-'}</td>
      <td class="up">${pct(x.zdp)}</td>
      <td>${boardType(x.c)}</td></tr>`).join('');
  document.getElementById('ladder-body').innerHTML = `<table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>类别</th></tr></thead><tbody>${rows}</tbody></table>`;
  bindRows('ladder-body');
}

/* ---------- 板块 ---------- */
async function loadSectors(){
  const conceptUrl = `https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=40&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:2&fields=f12,f14,f3,f62`;
  const indUrl = `https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=40&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:3&fields=f12,f14,f3,f62`;
  const [c, i] = await Promise.all([fetchJSON(conceptUrl), fetchJSON(indUrl)]);
  if(!c.ok){ showErr('sector-concept', c.err); } else { renderSector('sector-concept', c.data, '概念'); }
  if(!i.ok){ showErr('sector-industry', i.err); } else { renderSector('sector-industry', i.data, '行业'); }
}
function renderSector(boxId, data, label){
  const list = (data && data.data && data.data.diff) || [];
  if(list.length===0){ document.getElementById(boxId).innerHTML='<div class="ok-note">无数据</div>'; return; }
  let rows = list.slice(0,30).map(x=>{
    const up = Number(x.f3)>=0;
    return `<tr class="clickable" data-code="${x.f12}">
      <td><code>${x.f12}</code></td><td>${x.f14||''}</td>
      <td class="${up?'up':'down'}">${pct(x.f3)}</td>
      <td class="${Number(x.f62)>=0?'up':'down'}">${fmtMoney(x.f62)}</td></tr>`;
  }).join('');
  document.getElementById(boxId).innerHTML = `<table><thead><tr><th>代码</th><th>${label}</th><th>涨幅</th><th>主力净流入</th></tr></thead><tbody>${rows}</tbody></table>`;
  bindRows(boxId);
}

/* ---------- 指数 ---------- */
async function loadIndex(){
  const url = `https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=30&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:1+t:2&fields=f12,f14,f3`;
  const res = await fetchJSON(url);
  if(!res.ok){ showErr('index-body', res.err); return; }
  const list = (res.data && res.data.data && res.data.data.diff) || [];
  if(list.length===0){ document.getElementById('index-body').innerHTML='<div class="ok-note">无数据</div>'; return; }
  let rows = list.map(x=>{
    const up = Number(x.f3)>=0;
    return `<tr><td><code>${x.f12}</code></td><td>${x.f14||''}</td><td class="${up?'up':'down'}">${pct(x.f3)}</td></tr>`;
  }).join('');
  document.getElementById('index-body').innerHTML = `<table><thead><tr><th>代码</th><th>指数</th><th>涨跌幅</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- 龙虎榜 ---------- */
async function loadLHB(date){
  const iso = date.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3');
  const url = `https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_DAILYBILLBOARD_DETAILS&columns=SECURITY_CODE,SECURITY_NAME_ABBR,CHANGE_RATE,CLOSE_PRICE,EXPLAIN&date=${iso}&pagesize=40&sortColumns=CHANGE_RATE&sortTypes=-1&p=1`;
  const res = await fetchJSON(url);
  if(!res.ok){ showErr('lhb-body', res.err); return; }
  const arr = (res.data && res.data.result && res.data.result.data) || [];
  if(arr.length===0){ document.getElementById('lhb-body').innerHTML='<div class="ok-note">该日龙虎榜无数据（可能为非交易日）。</div>'; return; }
  let rows = arr.slice(0,40).map(x=>{
    const code = (x.SECURITY_CODE||'').replace(/\.(SZ|SH|BJ)$/,'');
    const chg = Number(x.CHANGE_RATE)/100;
    const up = chg>=0;
    return `<tr class="clickable" data-code="${code}">
      <td><code>${code}</code></td>
      <td>${x.SECURITY_NAME_ABBR||''}</td>
      <td class="${up?'up':'down'}">${pct(chg)}</td>
      <td>${x.CLOSE_PRICE!=null?Number(x.CLOSE_PRICE).toFixed(2):'-'}</td>
      <td style="white-space:normal;max-width:280px">${x.EXPLAIN||'-'}</td></tr>`;
  }).join('');
  document.getElementById('lhb-body').innerHTML = `<table><thead><tr><th>代码</th><th>名称</th><th>涨跌幅</th><th>收盘</th><th>上榜原因</th></tr></thead><tbody>${rows}</tbody></table>`;
  bindRows('lhb-body');
}

function bindRows(boxId){
  document.querySelectorAll('#'+boxId+' tr.clickable').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const code = tr.getAttribute('data-code');
      const u = emWebUrl(code);
      if(u) window.open(u,'_blank');
    });
  });
}

/* ---------- 跌停判定 & 跌停池 ---------- */
function isLimitDown(code, name, f3){
  const v = Number(f3); const nm = name||'';
  if(/^[NC]/.test(nm)) return false;                // 新股(N/C前缀)首日/次新无涨跌幅限制
  if(nm.indexOf('ST')>=0) return v <= -4.8;        // ST 5%
  if(/^(30|688|689)/.test(code)) return v <= -19.8; // 创业板/科创板 20%
  if(/^(8|4|92|87)/.test(code)) return v <= -29.5;  // 北交所 30%
  return v <= -9.9;                                 // 主板 10%
}
async function fetchLimitDownSet(){
  const fs = 'm:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23';
  const pool = [];
  for(let pn=1; pn<=5; pn++){
    const url = `https://push2delay.eastmoney.com/api/qt/clist/get?pn=${pn}&pz=100&po=0&np=1&fltt=2&invt=2&fid=f3&fs=${fs}&fields=f12,f14,f2,f3,f62&_=${Date.now()}_${pn}`;
    const res = await fetchJSON(url);
    if(!res.ok) break;
    const list = (res.data && res.data.data && res.data.data.diff) || [];
    if(list.length===0) break;
    let maxF3 = -999;
    list.forEach(x=>{ const v=Number(x.f3); if(v>maxF3) maxF3=v; if(isLimitDown(x.f12, x.f14, x.f3)) pool.push({ c:x.f12, n:x.f14, p:x.f2, zdp:x.f3, f62:x.f62 }); });
    if(maxF3 > -9.5) break;   // 本页最低已高于跌停阈值，后续不再有跌停股
  }
  return pool;
}
async function loadDT(){
  const pool = await fetchLimitDownSet();
  const box = document.getElementById('dt-body');
  if(pool===null){ showErr('dt-body','跌停池数据拉取失败（接口超时或被拦截）'); document.getElementById('dt-summary').innerHTML=''; return; }
  document.getElementById('dt-summary').innerHTML = `<div class="stat"><div class="v">${pool.length}</div><div class="k">跌停总数</div></div>`;
  if(pool.length===0){ box.innerHTML='<div class="ok-note">今日无跌停（可能为非交易日或已收盘无数据）。</div>'; return; }
  let rows = pool.map(x=>`<tr class="clickable" data-code="${x.c}">
      <td><code>${x.c}</code></td>
      <td>${x.n||''}</td>
      <td class="down">${x.p!=null?Number(x.p).toFixed(2):'-'}</td>
      <td class="down">${pct(x.zdp)}</td>
      <td class="${Number(x.f62)>=0?'up':'down'}">${fmtMoney(x.f62)}</td></tr>`).join('');
  box.innerHTML = `<table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>主力净流入</th></tr></thead><tbody>${rows}</tbody></table>`;
  bindRows('dt-body');
}

/* ---------- 资金流（板块 + 个股主力净流入）---------- */
async function loadCapital(){
  const conceptUrl = `https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=20&po=1&np=1&fltt=2&invt=2&fid=f62&fs=m:90+t:2&fields=f12,f14,f3,f62`;
  const indUrl = `https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=20&po=1&np=1&fltt=2&invt=2&fid=f62&fs=m:90+t:3&fields=f12,f14,f3,f62`;
  const stockUrl = `https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=20&po=1&np=1&fltt=2&invt=2&fid=f62&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f12,f14,f3,f62`;
  const [c,i,s] = await Promise.all([fetchJSON(conceptUrl), fetchJSON(indUrl), fetchJSON(stockUrl)]);
  let html='';
  if(c.ok){ html += `<div class="sec-title">概念板块 主力净流入 TOP20</div>`+renderCapRows(c.data,'概念'); }
  else { html += `<div class="err">概念板块资金流加载失败：${c.err}</div>`; }
  if(i.ok){ html += `<div class="sec-title">行业板块 主力净流入 TOP20</div>`+renderCapRows(i.data,'行业'); }
  else { html += `<div class="err">行业板块资金流加载失败：${i.err}</div>`; }
  if(s.ok){ html += `<div class="sec-title">个股 主力净流入 TOP20</div>`+renderCapRows(s.data,'个股'); }
  else { html += `<div class="err">个股资金流加载失败：${s.err}</div>`; }
  document.getElementById('cap-body').innerHTML = html;
  bindRows('cap-body');
}
function renderCapRows(data, label){
  const list = (data && data.data && data.data.diff) || [];
  if(list.length===0) return '<div class="ok-note">无数据</div>';
  let rows = list.slice(0,20).map(x=>{
    const up = Number(x.f3)>=0;
    return `<tr class="clickable" data-code="${x.f12}">
      <td><code>${x.f12}</code></td><td>${x.f14||''}</td>
      <td class="${up?'up':'down'}">${pct(x.f3)}</td>
      <td class="${Number(x.f62)>=0?'up':'down'}">${fmtMoney(x.f62)}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>代码</th><th>${label}</th><th>涨幅</th><th>主力净流入</th></tr></thead><tbody>${rows}</tbody></table><br>`;
}

/* ---------- 情绪面板 ---------- */
async function loadSentiment(){
  const box = document.getElementById('sentiment-body');
  const zt = currentPool ? currentPool.length : 0;
  const dt = currentDown ? currentDown.length : 0;
  let topZt = 0;
  if(currentPool){ currentPool.forEach(x=>{ const v=Number(x.zdp); if(v>topZt) topZt=v; }); }
  let heat = '数据不足';
  if(zt>0){
    if(zt>=80 && dt<=10) heat = '🔥 极强（涨停≥80 且跌停少）';
    else if(zt>=50) heat = '强势';
    else if(zt>=20) heat = '中性偏暖';
    else if(zt>=5) heat = '偏弱';
    else heat = '冰点';
  }
  box.innerHTML = `
    <div class="summary">
      <div class="stat"><div class="v">${zt}</div><div class="k">涨停家数</div></div>
      <div class="stat"><div class="v">${dt}</div><div class="k">跌停家数</div></div>
      <div class="stat"><div class="v">${topZt.toFixed(2)}%</div><div class="k">最高涨停(连板高度≈)</div></div>
    </div>
    <div class="ok-note">市场温度：<b>${heat}</b></div>
    <div class="tip" style="border-radius:8px;margin-top:10px">说明：涨停 / 跌停为实时真实数据；「连板高度」因零后端无历史连板数据，以当日最高涨停涨幅近似。炸板率、全市场涨跌家数需全市场扫描 / 历史接口，零后端暂未纳入。</div>`;
}

/* ---------- 北向资金（参考）---------- */
async function loadNorth(){
  const box = document.getElementById('north-body');
  const url = `https://push2delay.eastmoney.com/api/qt/kamt/get?fields1=f1,f3&fields2=f51,f52,f53,f54,f55,f56,f57,f58`;
  const res = await fetchJSON(url);
  if(!res.ok){ showErr('north-body', res.err); return; }
  const d = (res.data && res.data.data) || {};
  const fmtAmt = v => (v==null)?'-':(Number(v)/1e8).toFixed(2)+'亿';
  let html = `<div class="ok-note">⚠️ 港交所自 2024-08-19 起不再披露沪深股通<b>实时净买额</b>，故「当日净买额」常为 0；以下为接口返回的额度 / 累计值，仅供参考。</div><br>`;
  html += `<table><thead><tr><th>通道</th><th>当日净买额</th><th>额度余额</th><th>月度累计</th><th>年度累计</th><th>日期</th></tr></thead><tbody>`;
  [['沪股通', d.hk2sh], ['深股通', d.hk2sz]].forEach(([name, o])=>{
    if(!o){ html += `<tr><td>${name}</td><td colspan="5">无数据</td></tr>`; return; }
    html += `<tr><td>${name}</td>
      <td class="${Number(o.dayNetAmtIn)>=0?'up':'down'}">${fmtAmt(o.dayNetAmtIn)}</td>
      <td>${fmtAmt(o.dayAmtRemain)}</td>
      <td>${fmtAmt(o.monthNetAmtIn)}</td>
      <td>${fmtAmt(o.yearNetAmtIn)}</td>
      <td>${o.date2||o.date||'-'}</td></tr>`;
  });
  html += `</tbody></table>`;
  box.innerHTML = html;
}

/* ---------- tab 切换 ---------- */
document.querySelectorAll('.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
  });
});

/* ---------- 日期 & 加载 ---------- */
function isoDate(d){ return d.toISOString().slice(0,10); }
function lastTradingDay(date){
  const d = new Date(date);
  while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()-1); }
  return d;
}

let currentPool = null;
let currentDown = null;
async function loadAll(){
  const date = fmtDateInput(document.getElementById('dt').value);
  currentPool = await loadZT();
  renderLadder(currentPool);
  loadSectors();
  loadIndex();
  loadLHB(date);
  currentDown = await fetchLimitDownSet();
  loadDT();
  loadCapital();
  loadSentiment();
  loadNorth();
}
document.getElementById('dt').addEventListener('change', loadAll);
document.querySelector('.topbar a.refresh').addEventListener('click', e=>{ e.preventDefault(); loadAll(); });
document.getElementById('btnToday').addEventListener('click', ()=>{
  document.getElementById('dt').value = isoDate(lastTradingDay(new Date()));
  loadAll();
});
document.getElementById('btnYest').addEventListener('click', ()=>{
  const d = new Date(); d.setDate(d.getDate()-1);
  document.getElementById('dt').value = isoDate(lastTradingDay(d));
  loadAll();
});

// 默认落到最近交易日（今天若为周末则取上周五），避免打开即空白
document.getElementById('dt').value = isoDate(lastTradingDay(new Date()));
loadAll();
</script>
