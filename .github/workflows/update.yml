name: 更新小市值策略信号
on:
  schedule:
    - cron: '30 8 * * 2'   # 每周二 08:30 UTC ≈ 北京时间 16:30 收盘后
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 设 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 装依赖
        run: pip install akshare==1.18.64
      - name: 计算信号
        run: python strategy_signal.py
      - name: 生成网页
        run: python generate_site.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add smallcap/index.html data.json
          git commit -m "auto: 更新小市值信号 $(date +%F)" || echo "无变化"
          git push
