name: 更新小市值策略信号
on:
  schedule:
    - cron: '0 12 * * 2'   # 每周二 12:00 UTC = 北京时间 20:00（避开东财 16-17 点风控高峰）
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 设 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 装依赖
        run: pip install akshare==1.18.64
      - name: 计算信号（失败自动重跑）
        run: |
          for i in 1 2 3; do
            echo "========== 第 $i 轮尝试 =========="
            if python strategy_signal.py; then
              echo "第 $i 轮成功"
              exit 0
            fi
            echo "第 $i 轮失败"
            if [ "$i" -lt 3 ]; then
              echo "等待 60 秒后重跑..."
              sleep 60
            fi
          done
          echo "三轮均失败，终止"
          exit 1
      - name: 生成网页
        run: python generate_site.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add smallcap/index.html data.json shares.json 2>/dev/null || git add smallcap/index.html data.json
          git commit -m "auto: 更新小市值信号 $(date +%F)" || echo "无变化"
          git push
