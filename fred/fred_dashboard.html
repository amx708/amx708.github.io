<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRED 宏观监测看板</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Helvetica,sans-serif;background:#f6f7f9;color:#1a1a1a;padding:20px 24px 36px;line-height:1.5}
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  h1{font-size:22px;font-weight:700}
  .sub{color:#64748b;font-size:12px;margin-top:2px}
  .actions{display:flex;gap:8px;align-items:center}
  button{background:#2563eb;color:#fff;border:0;padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer}
  button:hover{background:#1d4ed8}
  button:disabled{background:#94a3b8;cursor:not-allowed}
  .summary{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;margin-bottom:18px}
  .summary h2{font-size:14px;color:#0f172a;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .summary ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px}
  .summary li{font-size:13px;color:#334155;padding:4px 0}
  .summary li b{color:#0f172a;font-weight:600;margin-right:4px}
  .summary li .ts{color:#94a3b8;font-size:11px;margin-left:4px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-left:6px}
  .badge.warn{background:#fef3c7;color:#92400e}
  .badge.ok{background:#dcfce7;color:#166534}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px 12px}
  .card h3{font-size:14px;color:#0f172a;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .card .meta{font-size:11px;color:#64748b;font-weight:400}
  .card .val{font-size:26px;font-weight:700;color:#0f172a;margin:6px 0 4px;letter-spacing:-.5px}
  .card .date{font-size:11px;color:#94a3b8;margin-bottom:10px}
  .card canvas{height:130px!important;width:100%!important}
  .card .hint{font-size:11px;color:#64748b;margin-top:8px;padding-top:8px;border-top:1px dashed #e5e7eb}
  .risk{margin-top:24px;padding:12px 16px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:12px;color:#92400e;line-height:1.6}
  footer{margin-top:18px;font-size:11px;color:#94a3b8;text-align:center}
  .loading{color:#94a3b8;font-size:12px;padding:20px;text-align:center}
  .err{color:#b91c1c;font-size:12px;padding:8px}
</style>
</head>
<body>

<header>
  <div>
    <h1>📊 FRED 宏观监测看板</h1>
    <p class="sub">数据源：圣路易斯联储 FRED · 每日自动更新 · 同域静态读取（无 CORS、Key 不暴露）</p>
  </div>
  <div class="actions">
    <span class="sub" id="update-time">--</span>
    <button id="refresh">🔄 刷新</button>
  </div>
</header>

<div class="summary">
  <h2>📌 结论速览（最新值）</h2>
  <ul id="summary"><li class="loading">加载中…</li></ul>
</div>

<div class="grid" id="cards"><div class="loading">拉取 FRED 数据中…</div></div>

<div class="risk">
⚠️ <b>风险提示</b>：本看板数据来自美国官方宏观指标，用于辅助判断全球宏观周期与汇率联动，不构成投资建议。A股/港股/大宗商品投资请结合国内政策、地缘与公司基本面综合判断。过往宏观规律不必然预示未来。
</div>

<footer>
FRED 公开数据 · 每日自动更新（GitHub Actions）· 数据可能修订
</footer>

<script src="chart.umd.min.js"></script>
<script>
// ========== 格式化 ==========
function fmtVal(fmt, v){
  switch(fmt){
    case 'pct2': return v.toFixed(2)+' %';
    case 'num4': return v.toFixed(4)+' 元';
    case 'usd2': return '$'+v.toFixed(2);
    case 'pp2':  return (v>=0?'+':'')+v.toFixed(2)+' pp';
    case 'binary': return v===1?'衰退中':'扩张期';
    default: return v.toFixed(2);
  }
}

// 7 张图顺序（与 data.json 的 series 对应）
const ORDER = ['FEDFUNDS','DEXCHUS','DCOILWTICO','DGS10','CPIAUCSL','T10Y2Y','USREC'];

// ========== 渲染单卡 ==========
const charts = {};
function buildCard(sid, entry){
  const arr = entry.data;
  if (!arr.length) return;
  const latest = arr[arr.length-1];
  const prev   = arr.length>=2 ? arr[arr.length-2] : null;
  const firstY = arr[0].date, lastY = latest.date;

  const card = document.createElement('div');
  card.className='card';

  let extraBadge = '';
  if (sid==='T10Y2Y') extraBadge = latest.value<0?'<span class="badge warn">⚠ 倒挂</span>':'<span class="badge ok">正常</span>';
  if (sid==='USREC')  extraBadge = latest.value===1?'<span class="badge warn">衰退中</span>':'<span class="badge ok">扩张</span>';

  card.innerHTML = `
    <h3>${entry.name}${extraBadge} <span class="meta">${entry.freq}</span></h3>
    <div class="val">${fmtVal(entry.fmt, latest.value)}</div>
    <div class="date">最新：${latest.date}${prev?` · 上期 ${prev.value.toFixed(2)}`:''}</div>
    <canvas id="c-${sid}"></canvas>
    <div class="hint">${entry.note} · 区间 ${firstY} → ${lastY}（${arr.length} 个观测点）</div>
  `;
  document.getElementById('cards').appendChild(card);

  const color = (sid==='DEXCHUS' && entry.invert) ? '#16a34a' : '#2563eb';
  const bg    = (sid==='DEXCHUS' && entry.invert) ? 'rgba(22,163,74,.08)' : 'rgba(37,99,235,.08)';

  const ctx = document.getElementById('c-'+sid).getContext('2d');
  charts[sid] = new Chart(ctx, {
    type:'line',
    data:{ labels:arr.map(o=>o.date), datasets:[{ data:arr.map(o=>o.value), borderColor:color, backgroundColor:bg, fill:true, tension:.25, pointRadius:0, borderWidth:1.5 }] },
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.parsed.y}`}}},
      scales:{ x:{display:false}, y:{ticks:{font:{size:10}, maxTicksLimit:5}, grid:{color:'#f1f5f9'}} } }
  });
}

function buildSummary(sid, entry){
  const arr = entry.data; if(!arr.length) return;
  const latest = arr[arr.length-1];
  const li = document.createElement('li');
  let badge = '';
  if (sid==='T10Y2Y') badge = latest.value<0?'<span class="badge warn">倒挂</span>':'<span class="badge ok">正常</span>';
  if (sid==='USREC')  badge = latest.value===1?'<span class="badge warn">衰退中</span>':'<span class="badge ok">扩张</span>';
  li.innerHTML = `<b>${entry.name}：</b>${fmtVal(entry.fmt, latest.value)}${badge}<span class="ts">(${latest.date})</span>`;
  document.getElementById('summary').appendChild(li);
}

// ========== 主流程：读同域 data.json ==========
async function refresh(){
  document.getElementById('cards').innerHTML = '<div class="loading">拉取 FRED 数据中…</div>';
  document.getElementById('summary').innerHTML = '<li class="loading">加载中…</li>';
  Object.values(charts).forEach(c=>c.destroy());
  for(const k of Object.keys(charts)) delete charts[k];

  let db;
  try{
    const r = await fetch('data.json?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    db = await r.json();
  } catch(e){
    document.getElementById('cards').innerHTML = `<div class="err" style="padding:14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px">
      <b>⚠️ 数据加载失败</b><br>无法读取 data.json（${e.message}）。<br>
      可能是 GitHub Pages 尚未完成首次部署（约 1-3 分钟），请稍后刷新；或数据文件尚未生成（GitHub Actions 每日自动生成，也可手动触发）。
    </div>` + document.getElementById('cards').innerHTML;
    return;
  }

  if (db.updated) document.getElementById('update-time').textContent = '数据更新：' + db.updated;

  for (const sid of ORDER){
    const entry = db.series?.[sid];
    if (!entry){ continue; }
    try{
      buildCard(sid, entry);
      buildSummary(sid, entry);
    } catch(err){ console.error(sid, err); }
  }
}

document.getElementById('refresh').addEventListener('click', async (e)=>{
  e.target.disabled = true; e.target.textContent = '⏳ 拉取中…';
  await refresh();
  e.target.disabled = false; e.target.textContent = '🔄 刷新';
});

refresh();
</script>
</body>
</html>
